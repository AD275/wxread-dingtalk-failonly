name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: false   # 不取消正在执行的阅读任务

on:
  schedule:
    # 北京时间 20:00 首次触发，22:00 检查是否需要补跑。
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境
    permissions:
      actions: read
      contents: read

    steps:
    - name: Check evening schedule
      id: schedule_gate
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        read -r day beijing_time <<< "$(TZ=Asia/Shanghai date '+%F %H%M')"
        if [[ "$EVENT_NAME" == schedule && "$beijing_time" < 2000 ]]; then
          echo "Scheduled run arrived outside the evening window; skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        {
          echo "should_run=true"
          echo "day=$day"
        } >> "$GITHUB_OUTPUT"

    - name: Set DNS to Google's DNS
      if: steps.schedule_gate.outputs.should_run == 'true'
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      if: steps.schedule_gate.outputs.should_run == 'true'
      uses: actions/checkout@v2

    - name: Set up Python
      if: steps.schedule_gate.outputs.should_run == 'true'
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      if: steps.schedule_gate.outputs.should_run == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Check for an earlier run today
      id: reading_day
      if: steps.schedule_gate.outputs.should_run == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        READING_DAY: ${{ steps.schedule_gate.outputs.day }}
      run: |
        if [[ "$(TZ=Asia/Shanghai date +%F)" != "$READING_DAY" ]]; then
          echo "The Beijing date changed while preparing the task; skipping."
          exit 0
        fi
        marker="wxread-started-$READING_DAY"
        count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$marker" --jq '.total_count')
        if [[ "$count" != 0 ]]; then
          echo "Already started a reading task on $READING_DAY; skipping."
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        printf '%s\n' "$READING_DAY" > "$RUNNER_TEMP/wxread-started.txt"
        {
          echo "proceed=true"
          echo "marker=$marker"
        } >> "$GITHUB_OUTPUT"

    - name: Record today's first attempt
      if: steps.reading_day.outputs.marker != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.reading_day.outputs.marker }}
        path: ${{ runner.temp }}/wxread-started.txt
        if-no-files-found: error
        retention-days: 3

    - name: Run deployment script
      if: steps.reading_day.outputs.proceed == 'true'
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSH_NOTIFY_TYPE: ${{ vars.PUSH_NOTIFY_TYPE }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        READ_MODE: ${{ vars.READ_MODE || (secrets.WEREAD_API_KEY != '' && 'adaptive') || 'fixed' }}
        WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        READING_DAY: ${{ steps.schedule_gate.outputs.day }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables

      run: |
        if [[ "$(TZ=Asia/Shanghai date +%F)" != "$READING_DAY" ]]; then
          echo "The Beijing date changed before the script started; skipping."
          exit 0
        fi
        python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
