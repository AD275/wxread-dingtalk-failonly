name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: false   # 随机时段多次触发时，不取消正在执行的阅读任务

on:
  schedule:
    # 北京时间每天 07:00-10:30，每 30 分钟短暂启动一次。
    # 后续 Random schedule gate 会按当天日期随机选中其中一个时段执行。
    - cron: '0 23 * * *'
    - cron: '30 23 * * *'
    - cron: '0 0 * * *'
    - cron: '30 0 * * *'
    - cron: '0 1 * * *'
    - cron: '30 1 * * *'
    - cron: '0 2 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境
    permissions:
      actions: read
      contents: read

    steps:
    - name: Random schedule gate
      id: schedule_gate
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_SCHEDULE: ${{ github.event.schedule }}
        REPOSITORY: ${{ github.repository }}
      run: |
        python - <<'PY'
        import hashlib
        import os
        from datetime import datetime, timedelta, timezone

        slots = [
            ("0 23 * * *", "07:00"),
            ("30 23 * * *", "07:30"),
            ("0 0 * * *", "08:00"),
            ("30 0 * * *", "08:30"),
            ("0 1 * * *", "09:00"),
            ("30 1 * * *", "09:30"),
            ("0 2 * * *", "10:00"),
            ("30 2 * * *", "10:30"),
        ]

        event_name = os.getenv("EVENT_NAME", "")
        event_schedule = os.getenv("EVENT_SCHEDULE", "")

        if event_name != "schedule":
            print("Manual run detected; continuing without random gate.")
            should_run = "true"
        else:
            beijing_today = (datetime.now(timezone.utc) + timedelta(hours=8)).date().isoformat()
            seed = f"{beijing_today}:{os.getenv('REPOSITORY', '')}:wxread"
            selected_index = int(hashlib.sha256(seed.encode("utf-8")).hexdigest(), 16) % len(slots)
            selected_cron, selected_time = slots[selected_index]
            current_time = dict(slots).get(event_schedule, "unknown")
            should_run = "true" if event_schedule == selected_cron else "false"
            print(f"Beijing date: {beijing_today}")
            print(f"Selected run time: {selected_time}")
            print(f"Current scheduled time: {current_time}")
            print(f"Should run: {should_run}")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"should_run={should_run}\n")
        PY

    - name: Set DNS to Google's DNS
      if: steps.schedule_gate.outputs.should_run == 'true'
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      if: steps.schedule_gate.outputs.should_run == 'true'
      uses: actions/checkout@v2

    - name: Set up Python
      if: steps.schedule_gate.outputs.should_run == 'true'
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      if: steps.schedule_gate.outputs.should_run == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Check for an earlier run today
      id: reading_day
      if: steps.schedule_gate.outputs.should_run == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        READ_MODE: ${{ vars.READ_MODE || (secrets.WEREAD_API_KEY != '' && 'adaptive') || 'fixed' }}
      run: |
        if [[ "$READ_MODE" != adaptive ]]; then
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        day=$(TZ=Asia/Shanghai date +%F)
        marker="wxread-started-$day"
        count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$marker" --jq '.total_count')
        if [[ "$count" != 0 ]]; then
          echo "Already started a reading task on $day; skipping."
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        printf '%s\n' "$day" > "$RUNNER_TEMP/wxread-started.txt"
        {
          echo "proceed=true"
          echo "day=$day"
          echo "marker=$marker"
        } >> "$GITHUB_OUTPUT"

    - name: Record today's first attempt
      if: steps.reading_day.outputs.marker != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.reading_day.outputs.marker }}
        path: ${{ runner.temp }}/wxread-started.txt
        if-no-files-found: error
        retention-days: 3

    - name: Run deployment script
      if: steps.reading_day.outputs.proceed == 'true'
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSH_NOTIFY_TYPE: ${{ vars.PUSH_NOTIFY_TYPE }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        READ_MODE: ${{ vars.READ_MODE || (secrets.WEREAD_API_KEY != '' && 'adaptive') || 'fixed' }}
        WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        READING_DAY: ${{ steps.reading_day.outputs.day }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables

      run: |
        python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
