name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: false   # 不取消正在执行的阅读任务

on:
  # GitHub 定时触发延迟不可靠，已改为由 Muse 每晚 23:30（北京时间）手动触发：
  # 动态模式按当天自读时长决定刷多久，且封顶到零点。queue-alert 看门狗保留作备份报警。
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境
    permissions:
      actions: read
      contents: read

    steps:
    - name: Check reading schedule
      id: schedule_gate
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_SCHEDULE: ${{ github.event.schedule }}
      run: |
        read -r day beijing_time <<< "$(TZ=Asia/Shanghai date '+%F %H%M')"
        period=evening
        if [[ "$EVENT_NAME" == schedule ]]; then
          if [[ "$EVENT_SCHEDULE" == '15 4 * * *' ]]; then
            period=midday
            if [[ "$beijing_time" < 1215 || "$beijing_time" > 1959 ]]; then
              echo "Scheduled midday run arrived outside its time window; skipping."
              exit 0
            fi
          elif [[ "$beijing_time" < 2000 ]]; then
            echo "Scheduled evening run arrived outside its time window; skipping."
            exit 0
          fi
        fi
        {
          echo "should_run=true"
          echo "day=$day"
          echo "period=$period"
        } >> "$GITHUB_OUTPUT"

    - name: Set DNS to Google's DNS
      if: steps.schedule_gate.outputs.should_run == 'true'
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      if: steps.schedule_gate.outputs.should_run == 'true'
      uses: actions/checkout@v2

    - name: Set up Python
      if: steps.schedule_gate.outputs.should_run == 'true'
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      if: steps.schedule_gate.outputs.should_run == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Check for an earlier run in this period
      id: reading_day
      if: steps.schedule_gate.outputs.should_run == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        READING_DAY: ${{ steps.schedule_gate.outputs.day }}
        READING_PERIOD: ${{ steps.schedule_gate.outputs.period }}
      run: |
        if [[ "$(TZ=Asia/Shanghai date +%F)" != "$READING_DAY" ]]; then
          echo "The Beijing date changed while preparing the task; skipping."
          exit 0
        fi
        marker="wxread-started-$READING_DAY"
        if [[ "$READING_PERIOD" == midday ]]; then
          marker="wxread-midday-started-$READING_DAY"
        fi
        count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$marker" --jq '.total_count')
        if [[ "$count" != 0 ]]; then
          echo "Already started a $READING_PERIOD reading task on $READING_DAY; skipping."
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$READING_PERIOD" == evening ]]; then
          midday_count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="wxread-midday-started-$READING_DAY" --jq '.total_count')
          if [[ ! "$midday_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not verify the midday reading record."
            exit 1
          fi
          if [[ "$midday_count" != 0 ]]; then
            echo "midday_started=true" >> "$GITHUB_OUTPUT"
          fi
        fi
        printf '%s\n' "$READING_DAY" > "$RUNNER_TEMP/wxread-started.txt"
        {
          echo "proceed=true"
          echo "marker=$marker"
        } >> "$GITHUB_OUTPUT"

    - name: Record today's first attempt for this period
      if: steps.reading_day.outputs.marker != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.reading_day.outputs.marker }}
        path: ${{ runner.temp }}/wxread-started.txt
        if-no-files-found: error
        retention-days: 3

    - name: Run deployment script
      if: steps.reading_day.outputs.proceed == 'true'
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSH_NOTIFY_TYPE: ${{ vars.PUSH_NOTIFY_TYPE }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        READ_MODE: ${{ (steps.schedule_gate.outputs.period == 'midday' && 'fixed') || vars.READ_MODE || (secrets.WEREAD_API_KEY != '' && 'adaptive') || 'fixed' }}
        WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        READING_DAY: ${{ steps.schedule_gate.outputs.day }}
        READING_PERIOD: ${{ steps.schedule_gate.outputs.period }}
        MIDDAY_STARTED: ${{ steps.reading_day.outputs.midday_started }}
        READ_NUM: ${{ (steps.schedule_gate.outputs.period == 'midday' && '10') || vars.READ_NUM }}

      run: |
        read -r day beijing_time <<< "$(TZ=Asia/Shanghai date '+%F %H%M')"
        if [[ "$day" != "$READING_DAY" ]]; then
          echo "The Beijing date changed before the script started; skipping."
          exit 0
        fi
        if [[ "$READING_PERIOD" == midday ]]; then
          if [[ "$beijing_time" > 1959 ]]; then
            echo "The midday window closed before the script started; skipping."
            exit 0
          fi
          timeout 15m python main.py
        else
          python main.py
        fi

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
